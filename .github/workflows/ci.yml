name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace
        run: npm ci

      # The monitor imports the analyzer's compiled contract, so build order matters.
      - name: Build
        run: npm run build

      # Checked here rather than with the other invariants because the validator is
      # generated by the build above; a job that only checks out does not have it.
      # A Worker refuses to evaluate generated source, so this failing at runtime
      # would mean failing on a real package in production.
      - name: The precompiled validator generates no code at runtime
        run: |
          set -euo pipefail
          validator=packages/sentinel/src/generated/report-validator.mjs
          if [ ! -f "$validator" ]; then
            echo "::error::$validator was not generated by the build."
            exit 1
          fi
          if grep -nE 'new Function|\beval\(' "$validator"; then
            echo "::error::The precompiled validator generates code at runtime and will not load in a Worker."
            exit 1
          fi
          echo "OK: the generated validator contains no runtime code generation."

      - name: Test analyzer
        run: npm run test --workspace mcp-sentinel

      - name: Test monitor
        run: npm run test --workspace @sentinel/watch

  invariants:
    name: Architectural invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The coverage figure is only worth what its provenance is worth. If the
      # analyzer changed and the corpus was not re-measured, the committed number
      # describes a build that no longer exists — which is exactly how coverage
      # regresses without anyone seeing it. No network: this compares the build
      # digest recorded in metrics.json against the one just built.
      - name: Coverage figures match the analyzer that produced them
        run: |
          npm ci
          npm run build --workspace mcp-sentinel
          recorded=$(node -p "require('./corpus/metrics.json').analyzer.engine.build_sha256")
          current=$(node -p "require('./packages/sentinel/dist/src/build-info.js').ANALYZER_BUILD_SHA256")
          if [ "$recorded" != "$current" ]; then
            echo "::error::corpus/metrics.json was produced by analyzer build $recorded, but this tree builds $current."
            echo "Re-run: node scripts/measure-coverage.mjs   (cached, no network, ~20s)"
            exit 1
          fi
          echo "OK: the committed coverage figures came from this analyzer."

      # docs/ is internal by default and published by exception. The exceptions
      # are listed here as well as in .gitignore, so relaxing the ignore rule is
      # not enough on its own to publish a working document by accident.
      - name: Only the intended documents are published
        run: |
          expected="docs/LIMITATIONS.md
          docs/PROTOCOL_PROFILE_2026-07-28.md
          docs/SPEC_PROVENANCE.md
          docs/SPEC_PROVENANCE.sha256"
          actual=$(git ls-files 'docs/*' | grep -v '^docs/change-reports/' || true)
          if [ "$(echo "$expected" | sed 's/^ *//' | sort)" != "$(echo "$actual" | sort)" ]; then
            echo "::error::The set of published documents changed. Internal working notes must stay unpublished."
            diff <(echo "$expected" | sed 's/^ *//' | sort) <(echo "$actual" | sort) || true
            exit 1
          fi
          echo "OK: only the intended documents are tracked."

      # The analyzer must never depend on a consumer of its reports. Dependencies
      # run one way: the monitor imports the analyzer, never the reverse.
      # Matched narrowly and deliberately. A bare "watch" would fire on ordinary
      # English ("watch out", "stopwatch"), and a guard that cries wolf gets
      # disabled, which is worse than no guard.
      - name: Analyzer has no downstream dependency
        run: |
          if grep -rniE '@sentinel/watch|packages/watch|mcp-watch|magus|opensecmcp' \
              packages/sentinel/src packages/sentinel/schemas 2>/dev/null; then
            echo "::error::The analyzer references a downstream consumer."
            exit 1
          fi
          echo "OK: analyzer is independent."

      # These modules are imported by consumers in constrained runtimes (edge
      # workers). A Node built-in creeping in breaks them at deploy time, not
      # build time, so it is checked here.
      - name: Exported modules stay runtime-agnostic
        run: |
          if grep -nE 'from "node:|require\(' packages/sentinel/src/diff.ts packages/sentinel/src/report-contract.ts; then
            echo "::error::A portable module imports a Node built-in."
            exit 1
          fi
          echo "OK: diff and report-contract are runtime-agnostic."

      # The analyzer runs inside the monitor's Worker, so everything reachable from
      # the ./analyze export must work without a filesystem or a subprocess. It may
      # use node:zlib, node:crypto and node:buffer, which workerd implements under
      # nodejs_compat; anything else fails at deploy time rather than here.
      # This job deliberately installs nothing, so every check here reads committed
      # sources only. Anything needing a build belongs in the build-and-test job.
      #
      # Note the list omits the generated build-info.ts: grep exits 2 on a missing
      # file, and an `if grep` reads that as "no match", so listing a file that a
      # bare checkout does not have would make this pass without checking anything.
      - name: The analyze path stays Worker-compatible
        run: |
          set -euo pipefail
          cd packages/sentinel
          reachable="src/analyze.ts src/archive.ts src/npm-registry.ts src/report.ts src/rules.ts src/schema.ts src/tool-surface.ts src/report-contract.ts"

          # A renamed or moved module would otherwise drop out of the check silently.
          for file in $reachable; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is listed as reachable from ./analyze but does not exist. Update this check."
              exit 1
            fi
          done

          if grep -nE 'from "node:(fs|path|url|child_process|worker_threads|os|net|http|https|vm)' $reachable; then
            echo "::error::A module on the ./analyze path imports a Node built-in unavailable in a Worker."
            exit 1
          fi
          # node-io.ts is where filesystem access is allowed to live. Reaching it
          # from the analyze path would put fs back on it by the side door.
          if grep -n 'node-io' $reachable; then
            echo "::error::A module on the ./analyze path imports node-io, which uses the filesystem."
            exit 1
          fi
          echo "OK: the analyze path uses only Worker-available built-ins."

      # ajv compiles a schema by generating and evaluating source, which a Worker
      # refuses outright. The generated artifact is checked in the build job, where
      # it exists; these two halves need only the sources.
      - name: Report validation is not compiled at runtime
        run: |
          set -euo pipefail
          if ! grep -qF 'generated/report-validator.mjs' packages/sentinel/src/schema.ts; then
            echo "::error::schema.ts does not use the precompiled validator."
            exit 1
          fi
          # A type-only ajv import is erased at compile time and is fine. Building a
          # validator at runtime is what a Worker refuses.
          if grep -rnE 'new Ajv|\.compile\(' packages/sentinel/src; then
            echo "::error::A schema is compiled at runtime. Precompile it in scripts/generate-validator.cjs instead."
            exit 1
          fi
          echo "OK: report validation is precompiled."

      # The analyzer states what changed; the monitor decides what it is worth.
      # Severity leaking into the analyzer would put product policy in the engine.
      - name: Analyzer assigns no severity
        run: |
          if grep -nE '"(high|review|critical)"' packages/sentinel/src/diff.ts; then
            echo "::error::The analyzer diff assigns severity. Ranking belongs to the consumer."
            exit 1
          fi
          echo "OK: no severity in the analyzer diff."

      # The monitor must consume reports through the published contract, never by
      # reaching into analyzer internals or re-declaring the report shape.
      - name: Monitor uses the published contract only
        run: |
          if grep -rnE 'from "mcp-sentinel/(src|dist)' packages/watch/src packages/watch/test 2>/dev/null; then
            echo "::error::The monitor reaches past the analyzer's exports."
            exit 1
          fi
          if grep -rnE '^export interface Sentinel(Report|Observation|Finding)' packages/watch/src 2>/dev/null; then
            echo "::error::The monitor re-declares the report contract. Import it instead."
            exit 1
          fi
          echo "OK: monitor consumes the published contract."

      # Guards against the two false alarms that would most damage trust in an
      # alerting product. Named explicitly so a refactor cannot quietly drop them.
      - name: False-alarm guards are tested
        run: |
          set -euo pipefail
          for name in \
            "does not invent tool changes when the baseline has no inventory" \
            "treats a missing tool as inconclusive when extraction was incomplete" \
            "an identical rebuild produces no reviewable changes"
          do
            if ! grep -qF "$name" packages/watch/test/policy.test.ts; then
              echo "::error::Required regression test missing: $name"
              exit 1
            fi
          done
          echo "OK: false-alarm guards present."

  secrets:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed secrets
        run: |
          if [ -f packages/watch/.dev.vars ]; then
            echo "::error::.dev.vars is committed. It holds live secrets."
            exit 1
          fi
          if grep -rnE '(OPERATOR_API_KEY|ANALYZER_INGEST_SECRET|ANALYZER_POLL_KEY)[[:space:]]*=[[:space:]]*["'\'']?[A-Za-z0-9+/_-]{16,}' \
              --exclude='*.example' --exclude-dir=.git --exclude-dir=node_modules . 2>/dev/null; then
            echo "::error::A secret value appears to be committed."
            exit 1
          fi
          echo "OK: no committed secret values."

      # This repository is public; the Cloudflare account behind it is not. An
      # account_id or a real database_id is an identifier rather than a credential
      # and grants nobody access, but it ties the two together, so it stays out.
      # Deploy from a gitignored wrangler.private.toml instead.
      - name: No Cloudflare account is identified
        run: |
          set -euo pipefail
          if ! grep -q 'REPLACE_WITH_D1_DATABASE_ID' packages/watch/wrangler.toml; then
            echo "::error::packages/watch/wrangler.toml no longer holds the database_id placeholder. Deploy from wrangler.private.toml and revert this file."
            exit 1
          fi
          if grep -rn 'account_id' --include='wrangler*.toml' . 2>/dev/null; then
            echo "::error::A Cloudflare account_id is committed."
            exit 1
          fi
          if git ls-files | grep -q 'wrangler.private.toml'; then
            echo "::error::wrangler.private.toml is committed. It holds real deployment identifiers."
            exit 1
          fi
          if grep -rnE '(CLOUDFLARE|CF)_API_TOKEN[[:space:]]*[=:][[:space:]]*["'\'']?[A-Za-z0-9_-]{20,}' \
              --exclude-dir=.git --exclude-dir=node_modules . 2>/dev/null; then
            echo "::error::A Cloudflare API token appears to be committed."
            exit 1
          fi
          echo "OK: no Cloudflare account identifiers or tokens committed."

  end-to-end:
    name: Real package end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace mcp-sentinel

      # A report that does not validate against its own schema is worthless as
      # evidence, so prove the CLI against a real published package.
      - name: Analyze a published MCP server
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e && cd /tmp/e2e
          npm pack @modelcontextprotocol/server-filesystem >/dev/null 2>&1
          TARBALL="$(ls ./*.tgz | head -1)"
          CLI="$GITHUB_WORKSPACE/packages/sentinel/dist/src/cli.js"
          node "$CLI" analyze "$TARBALL" --output report.json
          node "$CLI" analyze "$TARBALL" --output repeat.json
          node -e '
            const r = require("/tmp/e2e/report.json");
            const inv = r.observations.find(o => o.kind === "protocol_inventory");
            if (!inv || !Array.isArray(inv.data.tools)) throw new Error("no tool inventory");
            if (inv.data.tools.length === 0) throw new Error("expected tools from a known server");
            if (!/^[a-f0-9]{64}$/.test(r.analysis.rule_pack.sha256)) throw new Error("rule pack digest missing");
            console.log("ok:", inv.data.tools.length, "tools, complete =", inv.data.complete);
          '

      # Same artifact in, same evidence out. Determinism is the property the whole
      # change-detection story rests on.
      - name: Re-analysis is deterministic
        run: |
          set -euo pipefail
          cd /tmp/e2e
          node -e '
            const a = require("/tmp/e2e/report.json").observations;
            const b = require("/tmp/e2e/repeat.json").observations;
            if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error("re-analysis differed");
            console.log("ok: observations byte-identical across runs");
          '
          node "$GITHUB_WORKSPACE/packages/sentinel/dist/src/cli.js" diff report.json repeat.json | tee diff.txt
          grep -q "No normalized changes" diff.txt || { echo "::error::diff found changes between identical analyses"; exit 1; }
